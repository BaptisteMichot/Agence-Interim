# Service de l'application en TLS. Monté par-dessus nginx.conf lorsqu'on ajoute
# compose.https.yml ; il n'entre pas dans l'image, ce qui évite de la reconstruire pour
# passer d'un mode à l'autre.
#
# POURQUOI UN NOM D'HÔTE DÉDIÉ, ET PAS « localhost »
# Le HSTS émis plus bas vaut un an et ignore le numéro de port : reçu depuis
# https://localhost:8443, il forcerait en HTTPS *tout* ce qui répond sur localhost — le
# serveur de développement de Vite sur 5173 et le backend sur 8080 compris, qui
# deviendraient inaccessibles jusqu'à expiration, ou jusqu'à une purge manuelle dans les
# réglages du navigateur. Servir sur agence-interim.localhost cantonne le HSTS à ce nom.
# Le certificat ne porte d'ailleurs que celui-ci : accéder par localhost donne une erreur
# de certificat, ce qui ferme la porte à l'erreur plutôt que d'y faire confiance.
#
# Les navigateurs résolvent d'eux-mêmes tout nom en .localhost vers 127.0.0.1 (RFC 6761),
# il n'y a donc rien à ajouter au fichier hosts.

# ------------------------------------------------------- redirection depuis le clair
server {
    listen 80;
    server_name _;

    # Le port est écrit en toutes lettres parce que $host n'en porte pas et que le port
    # publié côté hôte (8443) n'est pas celui sur lequel nginx écoute (443) : une
    # redirection vers https://$host aboutirait sur le 443 de la machine, où rien ne
    # répond.
    return 301 https://$host:8443$request_uri;
}

# ------------------------------------------------------------------- application servie
server {
    listen 443 ssl;
    http2 on;
    server_name agence-interim.localhost;

    # Certificat auto-signé, généré hors du dépôt (voir le README). Le navigateur
    # avertira à la première visite : sans domaine public, aucune autorité ne peut
    # certifier ce nom, et c'est une limite du contexte, pas du montage.
    ssl_certificate     /etc/nginx/certs/agence.crt;
    ssl_certificate_key /etc/nginx/certs/agence.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Une fois le site visité en HTTPS, le navigateur refuse d'y revenir en clair : cela
    # ferme la fenêtre de la toute première requête, celle qu'une redirection ne protège
    # pas. Volontairement sans includeSubDomains ni preload, contrairement à ce que le
    # backend émet pour l'API : sur un nom de développement, engager les sous-domaines et
    # demander l'inscription sur la liste des navigateurs n'aurait aucun sens.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/app-common.conf;
}
