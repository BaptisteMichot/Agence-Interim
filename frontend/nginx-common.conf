# Corps commun aux deux façons de servir l'application, en clair et en TLS.
#
# Ce fichier est inclus depuis un bloc `server`, jamais utilisé seul. Il rassemble tout
# ce qui ne dépend pas du protocole : les en-têtes de sécurité, le repli de l'application
# à page unique, et les deux relais vers le backend. Ce qui en dépend — l'écoute, le
# certificat, la redirection, le HSTS — reste dans les fichiers qui l'incluent.
#
# Les `add_header` figurent ici et non dans le bloc appelant, parce qu'en nginx une
# directive `add_header` posée dans un bloc enfant efface toutes celles héritées : les
# garder au même niveau évite de les perdre par inadvertance.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Le CV plafonne à 5 Mo côté application : nginx rejette un envoi démesuré avant qu'il
# n'atteigne le serveur applicatif.
client_max_body_size 8m;

# Résolveur DNS interne de Docker.
#
# Sans lui, nginx résout le nom du serveur relayé une seule fois, au démarrage, et refuse
# de démarrer si « backend » n'est pas encore joignable : « host not found in upstream ».
# Le nom placé dans une variable reporte la résolution à chaque requête.
resolver 127.0.0.11 valid=10s;
set $backend "http://backend:8080";

root /usr/share/nginx/html;
index index.html;

location / {
    # Application à page unique : /interimaire/missions/12 n'existe pas sur le disque,
    # c'est une route du routeur React. Sans ce repli, un rechargement de page ou un lien
    # collé dans la barre d'adresse rendrait un 404.
    try_files $uri $uri/ /index.html;
}

# Les fichiers produits par le build portent une empreinte dans leur nom : leur contenu
# ne change jamais sous un même nom. index.html, lui, ne doit jamais être mis en cache —
# c'est lui qui désigne les nouvelles versions.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /api/ {
    proxy_pass $backend;
    proxy_set_header Host              $host;
    # X-Forwarded-* : c'est sur eux que repose FORWARD_HEADERS_STRATEGY côté Spring, et
    # c'est $scheme qui lui apprend que la requête est arrivée chiffrée — sans quoi il
    # n'émettrait pas le HSTS et refuserait de considérer la connexion comme sûre.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
}

location /ws/ {
    proxy_pass $backend;
    # La mise à niveau du protocole exige HTTP/1.1 et ces deux en-têtes ; sans eux, la
    # poignée de main échoue et le chat retombe sur son envoi de secours en HTTP.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    # Origin est relayé tel quel : WebSocketConfig n'accepte la poignée de main que si
    # cette valeur correspond exactement à app.frontend.url.
    proxy_set_header Origin     $http_origin;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Une conversation ouverte n'échange rien pendant de longues minutes : avec le délai
    # par défaut d'une minute, le proxy couperait la connexion et le client se
    # reconnecterait en boucle.
    proxy_read_timeout 3600s;
}
