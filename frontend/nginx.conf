# Configuration nginx du conteneur frontend.
#
# En développement, le serveur de Vite rendait trois services que plus personne n'assure
# une fois l'application construite : servir les fichiers, relayer /api vers Spring, et
# relayer /ws en négociant la mise à niveau du protocole. Ce fichier reprend ces trois
# rôles. Il dérive de deploy/nginx.conf.example, dont il retire la terminaison TLS et le
# HSTS : tant que l'application est servie en clair, un HSTS serait un engagement que
# rien ne tient.

server {
    listen 80;
    server_name _;

    # --- En-têtes de sécurité ---------------------------------------------------------
    #
    # always : ils doivent accompagner aussi les réponses d'erreur, sans quoi une page
    # 404 sortirait sans politique.
    #
    # La CSP est celle que vite.config.ts injecte en balise <meta>, augmentée de
    # frame-ancestors, qu'une balise ne peut pas exprimer. Les deux s'appliquent
    # simultanément et le navigateur retient la plus restrictive : elles doivent donc
    # rester alignées, sous peine de bloquer une ressource que l'autre autorise.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Le CV plafonne à 5 Mo côté application : nginx rejette un envoi démesuré avant
    # qu'il n'atteigne le serveur applicatif.
    client_max_body_size 8m;

    # Résolveur DNS interne de Docker.
    #
    # Sans lui, nginx résout les noms des serveurs relayés une seule fois, au démarrage,
    # et refuse de démarrer si « backend » n'est pas encore joignable : « host not found
    # in upstream ». Le nom est donc placé dans une variable, ce qui reporte la
    # résolution à chaque requête et laisse le backend arriver à son rythme.
    resolver 127.0.0.11 valid=10s;
    set $backend "http://backend:8080";

    # --- Fichiers statiques -------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Application à page unique : /interimaire/missions/12 n'existe pas sur le
        # disque, c'est une route du routeur React. Sans ce repli, un rechargement de
        # page ou un lien collé dans la barre d'adresse rendrait un 404.
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers produits par le build portent une empreinte dans leur nom : leur
    # contenu ne change jamais sous un même nom, ils peuvent donc être gardés
    # indéfiniment. index.html, lui, ne doit jamais l'être — c'est lui qui désigne les
    # nouvelles versions.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API ------------------------------------------------------------------------------
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host              $host;
        # X-Forwarded-* : c'est sur eux que repose FORWARD_HEADERS_STRATEGY côté Spring.
        # Ils ne méritent cette confiance que parce que ce proxy est le seul chemin
        # d'entrée — le port du backend n'est pas publié hors du réseau des conteneurs.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --- WebSocket du chat -----------------------------------------------------------------
    location /ws/ {
        proxy_pass $backend;
        # La mise à niveau du protocole exige HTTP/1.1 et ces deux en-têtes ; sans eux,
        # la poignée de main échoue et le chat retombe sur son envoi de secours en HTTP.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Origin est relayé tel quel : WebSocketConfig n'accepte la poignée de main que
        # si cette valeur correspond exactement à app.frontend.url. La réécrire ferait
        # échouer la vérification d'origine côté Spring.
        proxy_set_header Origin     $http_origin;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une conversation ouverte n'échange rien pendant de longues minutes : avec le
        # délai par défaut d'une minute, le proxy couperait la connexion et le client se
        # reconnecterait en boucle.
        proxy_read_timeout 3600s;
    }
}
