# Service de l'application en clair, sur le port 80 du conteneur.
#
# C'est le mode par défaut de `docker compose up`. Tout ce qui ne dépend pas du protocole
# vit dans nginx-common.conf, partagé avec la variante TLS.

server {
    listen 80;
    server_name _;

    include /etc/nginx/app-common.conf;
}
