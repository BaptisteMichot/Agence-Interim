spring.datasource.url=jdbc:h2:mem:agence_interim_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
security.jwt.secret=test-secret-that-is-at-least-32-characters-long
security.jwt.expiration-minutes=60
app.frontend.url=http://localhost:5173
app.mail.enabled=false
# Ce fichier remplace entierement celui de main : toute propriete lue par un @Value
# doit y figurer, sinon le contexte Spring refuse de demarrer et tous les tests echouent.
app.security.cookie-secure=false
app.security.encryption-key=cle-de-test-de-plus-de-32-caracteres-pour-aes
app.demo-data.password=MotDePasseDeTest123!
app.retention.enabled=false

# Le contrat porte l'identite de l'agence signataire : sans ces valeurs, les tests du
# cycle de vie d'une mission produiraient un PDF ou figure le mot "null".
app.agency.name=Agence Interim de test
app.agency.address=Rue de la Gare 1, 7000 Mons
app.agency.company-number=0454.460.440
app.agency.licence-number=W.INT.999
app.agency.joint-committee=322
# Les PDF generes par les tests vont sous target/, que mvn clean efface, et non dans
# le dossier uploads/ de developpement.
app.contract.storage-dir=target/test-contracts

# Le CV depose par les tests va sous target/, comme les contrats.
app.cv.storage-dir=target/test-cv
