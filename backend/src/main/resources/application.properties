# Seule ligne qui ne peut pas venir du .env : c'est elle qui le charge.
# Les deux chemins permettent de lancer l'application depuis backend/ (CLI Maven)
# comme depuis la racine du dépôt (bouton Run de l'IDE).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=${APP_NAME}

# Toute la configuration vient du .env : ce fichier ne fait que la relier aux proprietes Spring.
# Aucune valeur par defaut ici, pour qu'il n'existe qu'un seul endroit ou lire la configuration.
# Une variable manquante fait echouer le demarrage avec un message explicite, plutot que de
# laisser l'application tourner sur une valeur implicite.

server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}

# Choix d'architecture, pas un reglage d'environnement : la session JPA se ferme avec la
# transaction du service. Les DTO sont deja assembles a l'interieur (@Transactional), donc
# aucune requete ne doit partir pendant l'ecriture de la reponse. Laisser la valeur par
# defaut (true) masquerait des chargements paresseux hors transaction, un par ligne affichee.
spring.jpa.open-in-view=false

# Jeu de donnees de demonstration (comptes test@*.com et volumes suffisants pour voir la
# pagination). Sans effet si les comptes existent deja. A laisser a false hors developpement.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}

# Le jeton voyage dans un cookie HttpOnly, pas dans le stockage du navigateur : une
# injection XSS ne peut pas le lire. L'attribut Secure doit rester faux tant que
# l'application est servie en clair (le navigateur ignorerait le cookie), et passer a
# vrai des que le HTTPS est en place.
app.security.cookie-secure=${COOKIE_SECURE}

# Upload du CV : la limite metier des 5 Mo est une exigence de l'analyse et reste dans le code
# (CvService.MAX_SIZE_BYTES) ; seules les limites techniques du serveur sont configurables.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

# Stockage des fichiers deposes et generes.
app.cv.storage-dir=${CV_STORAGE_DIR}
app.contract.storage-dir=${CONTRACT_STORAGE_DIR}

# Compte administrateur amorce au demarrage s'il n'existe pas (laisser vide pour ne pas en creer).
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Identite de l'agence d'interim, reprise sur les contrats (mentions legales obligatoires).
app.agency.name=${AGENCY_NAME}
app.agency.address=${AGENCY_ADDRESS}
app.agency.company-number=${AGENCY_COMPANY_NUMBER}
app.agency.licence-number=${AGENCY_LICENCE_NUMBER}
app.agency.joint-committee=${AGENCY_JOINT_COMMITTEE}

# Signature du contrat : code a usage unique envoye par email au signataire.
app.signature.code-validity-minutes=${SIGNATURE_CODE_VALIDITY_MINUTES}

# Emails (contact automatique des candidats). MAIL_ENABLED=false => emails journalises (simules).
app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}
app.frontend.url=${FRONTEND_URL}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS}

# Mot de passe des comptes de demonstration (sans effet si DEMO_DATA_ENABLED=false).
app.demo-data.password=${DEMO_DATA_PASSWORD:changez-moi-en-developpement}

# Cle de chiffrement des donnees sensibles au repos (numero de registre national, IBAN).
# Au moins 32 caracteres. La perdre rend ces deux champs illisibles : elle se sauvegarde
# avec la meme rigueur que la base, mais jamais au meme endroit qu'elle.
app.security.encryption-key=${ENCRYPTION_KEY}

# Politique de conservation (RGPD). Desactivee par defaut : une tache qui efface ne
# s'active qu'une fois les durees arretees et reprises dans la politique de confidentialite.
app.retention.enabled=${RETENTION_ENABLED:false}
app.retention.message-months=${RETENTION_MESSAGE_MONTHS:24}
app.retention.contract-years=${RETENTION_CONTRACT_YEARS:5}
app.retention.dormant-account-months=${RETENTION_DORMANT_MONTHS:24}

# Derriere un reverse proxy qui termine le TLS, la requete arrive en clair sur Tomcat :
# sans cette ligne, request.isSecure() est faux, Spring n'emet pas le HSTS, et le quota
# par adresse compte toutes les requetes sur celle du proxy. Les en-tetes X-Forwarded-*
# ne sont pris en compte que parce que le proxy est le seul chemin d'entree.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Les erreurs ne decrivent pas l'interieur de l'application au client.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Corps des emails simules. En developpement, MAIL_ENABLED=false : le corps doit rester
# visible dans la console, sinon les codes de signature et de reinitialisation sont
# inutilisables. En production, ProductionGuard impose MAIL_ENABLED=true, donc la
# simulation ne s'execute jamais et ce reglage est sans effet ; le passer a INFO ferme
# quand meme la porte si les emails venaient a retomber en simulation.
logging.level.be.agence_interim.service.MailService=${MAIL_LOG_LEVEL:DEBUG}
