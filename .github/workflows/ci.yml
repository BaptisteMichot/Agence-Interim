# Intégration continue : rejoue à chaque poussée les vérifications qui étaient jusqu'ici
# lancées à la main. C'est ce qui donne leur valeur aux tests — un test qui ne s'exécute
# que lorsqu'on y pense ne protège de rien.
#
# Les deux moitiés du projet sont vérifiées par deux tâches distinctes, qui s'exécutent
# en parallèle : elles n'ont aucune dépendance l'une envers l'autre, et un échec du
# frontend ne doit pas masquer l'état du backend.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Une poussée rend inutile la vérification de la précédente sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          # Le cache porte sur le dépôt local Maven, retrouvé par le pom.
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Les tests n'ont besoin d'aucun service : la base est une H2 en mémoire, et
      # src/test/resources/application.properties remplace entièrement la configuration
      # de production, y compris son import du fichier .env — lequel n'existe pas ici,
      # et ne doit surtout pas y exister.
      - name: Lancer la suite de tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      # Le journal de la console est tronqué et illisible ; les rapports disent quel test
      # a échoué et sur quelle assertion.
      - name: Conserver les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci et non npm install : les versions installées sont exactement celles du
      # verrou, donc celles éprouvées en développement.
      - name: Installer les dépendances
        run: npm ci

      # « build » enchaîne le contrôle de types et la compilation Vite : une erreur de
      # type comme une erreur de construction arrête la tâche.
      - name: Contrôler les types et construire
        run: npm run build

      - name: Analyser le code
        run: npx oxlint src
